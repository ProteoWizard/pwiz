# GitHub Actions leg of the pwiz library + tools build (the official CI is TeamCity:
# ProteoWizard_CoreWindowsNet / ProteoWizard_CoreLinuxNet). Runs build.sh on Ubuntu:
# dotnet restore + build + test of Pwiz.sln without the Windows-only vendor SDKs.
name: Core Linux .NET (GitHub Actions)

on:
  push:
    branches: [ master ]
    paths-ignore:
    - 'pwiz_tools/Shared/**'
    - 'pwiz_tools/Osprey/**'
    - 'pwiz_tools/Skyline/**'
    - '.github/workflows/cherrypick*release.yml'
    - '.github/workflows/*on_demand.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
    - 'pwiz_tools/Shared/**'
    - 'pwiz_tools/Osprey/**'
    - 'pwiz_tools/Skyline/**'
    - '.github/workflows/cherrypick*release.yml'
    - '.github/workflows/*on_demand.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and test on Ubuntu
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up .NET (version pinned by global.json)
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Build and test
      run: ./build.sh Release --i-agree-to-the-vendor-licenses --without-mascot --automated
